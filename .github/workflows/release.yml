name: GitHub Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AMPLY_KEYSTORE_PASSWORD: ${{ secrets.AMPLY_KEYSTORE_PASSWORD }}
      AMPLY_KEY_ALIAS: ${{ secrets.AMPLY_KEY_ALIAS }}
      AMPLY_KEY_PASSWORD: ${{ secrets.AMPLY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate tag, version, version code, and target
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_COMMIT_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$TAG_COMMIT_SHA"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test "$TAG_VERSION" = "$VERSION_NAME"
          test -n "$VERSION_CODE"
          grep -q '?: 36' app/build.gradle.kts
          PREVIOUS_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -Fxv "$GITHUB_REF_NAME" | head -1 || true)"
          PREVIOUS_CODE=0
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_CODE="$(git show "$PREVIOUS_TAG:app/build.gradle.kts" | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' | head -1)"
            test -n "$PREVIOUS_CODE"
          fi
          test "$VERSION_CODE" -gt "$PREVIOUS_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$TAG_COMMIT_SHA" >> "$GITHUB_OUTPUT"
      - name: Find successful CI run for tagged commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT_SHA: ${{ steps.version.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --workflow ci.yml \
            --branch main \
            --commit "$TAG_COMMIT_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          if [[ -z "$RUN_ID" ]]; then
            echo "No successful main-branch CI run exists for tagged commit $TAG_COMMIT_SHA." >&2
            exit 1
          fi

          test "$(gh run view "$RUN_ID" --json headSha --jq '.headSha')" = "$TAG_COMMIT_SHA"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download CI release build
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          TAG_COMMIT_SHA: ${{ steps.version.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-release
          gh run download "$CI_RUN_ID" \
            --name "release-build-$TAG_COMMIT_SHA" \
            --dir ci-release
          test "$(tr -d '[:space:]' < ci-release/commit-sha.txt)" = "$TAG_COMMIT_SHA"
          test -s ci-release/app-release-unsigned-aligned.apk
          test -s ci-release/mapping.txt
      - name: Materialize signing key
        env:
          AMPLY_KEYSTORE_BASE64: ${{ secrets.AMPLY_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AMPLY_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/amply-signing"
          printf '%s' "$AMPLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/amply-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/amply-signing/release.jks"
          echo "AMPLY_KEYSTORE_PATH=$RUNNER_TEMP/amply-signing/release.jks" >> "$GITHUB_ENV"
      - name: Sign, verify, and name release APK
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="ci-release/app-release-unsigned-aligned.apk"
          APK="Amply-${GITHUB_REF_NAME}.apk"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"

          test -n "$AAPT"
          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"

          "$ZIPALIGN" -c -P 16 -v 4 "$SOURCE_APK"
          "$APKSIGNER" sign \
            --ks "$AMPLY_KEYSTORE_PATH" \
            --ks-key-alias "$AMPLY_KEY_ALIAS" \
            --ks-pass env:AMPLY_KEYSTORE_PASSWORD \
            --key-pass env:AMPLY_KEY_PASSWORD \
            --out "$APK" \
            "$SOURCE_APK"

          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          ! "$AAPT" dump permissions "$APK" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep 'android:allowBackup' | grep -q '0x0'
          unzip -l "$APK" | grep -q 'assets/NOTICE'
          unzip -l "$APK" | grep -q 'assets/third_party_attributions.html'
          unzip -l "$APK" | grep -Eq 'assets/dexopt/baseline\.prof|BUNDLE-METADATA/com\.android\.tools\.build\.profiles/baseline-prof\.txt'

          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
      - name: Keep R8 mapping private
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-${{ github.ref_name }}
          retention-days: 90
          if-no-files-found: error
          path: ci-release/mapping.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.artifacts.outputs.apk }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --verify-tag \
            --title "Amply $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Version code: $VERSION_CODE

          Verify the APK with the attached SHA-256 file. See the repository README for sideload instructions, limitations, source, and Apache-2.0 license."
