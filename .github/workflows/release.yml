name: GitHub Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AMPLY_KEYSTORE_PASSWORD: ${{ secrets.AMPLY_KEYSTORE_PASSWORD }}
      AMPLY_KEY_ALIAS: ${{ secrets.AMPLY_KEY_ALIAS }}
      AMPLY_KEY_PASSWORD: ${{ secrets.AMPLY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag, version, version code, and target
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test "$TAG_VERSION" = "$VERSION_NAME"
          test -n "$VERSION_CODE"
          grep -q '?: 36' app/build.gradle.kts
          PREVIOUS_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -Fxv "$GITHUB_REF_NAME" | head -1 || true)"
          PREVIOUS_CODE=0
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_CODE="$(git show "$PREVIOUS_TAG:app/build.gradle.kts" | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' | head -1)"
            test -n "$PREVIOUS_CODE"
          fi
          test "$VERSION_CODE" -gt "$PREVIOUS_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Materialize signing key
        env:
          AMPLY_KEYSTORE_BASE64: ${{ secrets.AMPLY_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AMPLY_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/amply-signing"
          printf '%s' "$AMPLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/amply-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/amply-signing/release.jks"
          echo "AMPLY_KEYSTORE_PATH=$RUNNER_TEMP/amply-signing/release.jks" >> "$GITHUB_ENV"
      - name: Build signed production APK
        run: ./gradlew --dependency-verification=strict clean testDebugUnitTest lintDebug assembleRelease
      - name: Verify and name release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$SOURCE_APK"
          "$AAPT" dump badging "$SOURCE_APK" | grep -q "targetSdkVersion:'36'"
          "$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK"
          ! "$AAPT" dump permissions "$SOURCE_APK" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'
          "$AAPT" dump xmltree "$SOURCE_APK" AndroidManifest.xml | grep 'android:allowBackup' | grep -q '0x0'
          unzip -l "$SOURCE_APK" | grep -q 'assets/NOTICE'
          unzip -l "$SOURCE_APK" | grep -q 'assets/third_party_attributions.html'
          unzip -l "$SOURCE_APK" | grep -Eq 'assets/dexopt/baseline\.prof|BUNDLE-METADATA/com\.android\.tools\.build\.profiles/baseline-prof\.txt'
          APK="Amply-${GITHUB_REF_NAME}.apk"
          cp "$SOURCE_APK" "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
      - name: Keep R8 mapping private
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.ref_name }}
          retention-days: 90
          if-no-files-found: error
          path: app/build/outputs/mapping/release/mapping.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.artifacts.outputs.apk }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --verify-tag \
            --title "Amply $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Version code: $VERSION_CODE

          Verify the APK with the attached SHA-256 file. See the repository README for sideload instructions, limitations, source, and Apache-2.0 license."
