name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify, test, lint, and assemble
        run: ./gradlew --dependency-verification=strict testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Compile Android 17 compatibility build
        run: ./gradlew --dependency-verification=strict assembleDebug -PamplyTargetSdk=37
      - name: Check production manifest and APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$APK"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          ! "$AAPT" dump permissions "$APK" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep 'android:allowBackup' | grep -q '0x0'
          unzip -l "$APK" | grep -q 'assets/NOTICE'
          unzip -l "$APK" | grep -q 'assets/third_party_attributions.html'
          unzip -l "$APK" | grep -Eq 'assets/dexopt/baseline\.prof|BUNDLE-METADATA/com\.android\.tools\.build\.profiles/baseline-prof\.txt'
          test -s app/build/outputs/mapping/release/mapping.txt
      - name: Enforce release size budget
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          BASELINE="$(tr -d '[:space:]' < ci/release-apk-size.txt)"
          ACTUAL="$(stat -c%s "$APK")"
          LIMIT="$((BASELINE + BASELINE / 10))"
          echo "Release APK: $ACTUAL bytes; baseline: $BASELINE; limit: $LIMIT"
          test "$ACTUAL" -le "$LIMIT"
      - name: Stage promotable release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APK"
          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"

          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo 'CI release APK is unexpectedly signed.' >&2
            exit 1
          fi

          mkdir -p release-build
          "$ZIPALIGN" -P 16 -f 4 "$APK" release-build/app-release-unsigned-aligned.apk
          "$ZIPALIGN" -c -P 16 -v 4 release-build/app-release-unsigned-aligned.apk
          if "$APKSIGNER" verify release-build/app-release-unsigned-aligned.apk >/dev/null 2>&1; then
            echo 'Staged CI APK is unexpectedly signed.' >&2
            exit 1
          fi
          cp app/build/outputs/mapping/release/mapping.txt release-build/mapping.txt
          printf '%s\n' "$GITHUB_SHA" > release-build/commit-sha.txt
      - name: Upload promotable release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release-build-${{ github.sha }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: release-build/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 33, 36]
    steps:
      - uses: actions/checkout@v7
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compose and manifest instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --dependency-verification=strict connectedDebugAndroidTest
